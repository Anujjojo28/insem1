```html
<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background: lightblue;
        }

        .delete {
            background: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Management System</h2>

    <form id="studentForm">
        <input type="text" id="sid" placeholder="Student ID" required>
        <input type="text" id="name" placeholder="Student Name" required>
        <input type="text" id="course" placeholder="Course" required>
        <input type="number" id="marks" placeholder="Marks (0-100)"
               min="0" max="100" required>
        <button type="submit">Add Student</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentTable"></tbody>
    </table>

</div>

<script>
    let students = JSON.parse(localStorage.getItem("students")) || [];

    function displayStudents() {
        let table = document.getElementById("studentTable");
        table.innerHTML = "";

        students.forEach(function(s, index) {
            table.innerHTML += `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.name}</td>
                    <td>${s.course}</td>
                    <td>${s.marks}</td>
                    <td>
                        <button class="delete"
                        onclick="deleteStudent(${index})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    document.getElementById("studentForm").onsubmit = function(e) {
        e.preventDefault();

        let student = {
            id: document.getElementById("sid").value.trim(),
            name: document.getElementById("name").value.trim(),
            course: document.getElementById("course").value.trim(),
            marks: Number(document.getElementById("marks").value)
        };

        if (students.some(s => s.id === student.id)) {
            alert("Student ID already exists!");
            return;
        }

        students.push(student);

        localStorage.setItem("students", JSON.stringify(students));

        this.reset();
        displayStudents();
    };

    function deleteStudent(index) {
        students.splice(index, 1);

        localStorage.setItem("students", JSON.stringify(students));

        displayStudents();
    }

    displayStudents();
</script>

</body>
</html>
